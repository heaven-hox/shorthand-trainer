[project]
name = "shorthand-trainer"
version = "0.1.2"
description = "方式に依存しない、紙で学ぶ日本語速記の練習アプリ"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = ["numpy>=2.1,<3", "sounddevice>=0.5,<0.6"]

[project.scripts]
shorthand-trainer = "shorthand_trainer.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gui: requires a graphical display and --run-gui"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
